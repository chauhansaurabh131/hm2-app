apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'
project.ext.envConfigFiles = [ debug: ".env", release: ".env" ]
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.happymilan2"
    defaultConfig {
        applicationId "com.happymilan2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 48
        versionName "3.6.7"
        multiDexEnabled= true
        externalNativeBuild {
            cmake {
                cppFlags "-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384"
                cFlags "-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384"
            }
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        vectorDrawables.useSupportLibrary = true
        missingDimensionStrategy 'react-native-camera', 'general'
        resConfigs "en", "hi"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            storeFile file("my-release-key.keystore")
            storePassword "123456"
            keyAlias "my-key-alias"
            keyPassword "123456"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                    "proguard-android.txt"
            ), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    debugImplementation("com.facebook.react:flipper-integration")
    implementation 'com.facebook.fresco:animated-gif:2.6.0'
    implementation 'com.facebook.fresco:animated-webp:2.0.0'
    implementation 'com.facebook.fresco:webpsupport:2.0.0'



//    implementation("com.facebook.react:react-android")
//    implementation("com.facebook.react:flipper-integration")
//    implementation 'com.facebook.fresco:fresco:2.0.0'
//    implementation 'com.facebook.fresco:animated-gif:2.0.0'
//    implementation 'com.facebook.fresco:animated-gif:2.6.0'
//    implementation 'com.facebook.fresco:animated-webp:2.0.0'
//    implementation 'com.facebook.fresco:webpsupport:2.0.0'
//    implementation 'com.facebook.fresco:fresco:1.10.0'
//    implementation 'com.facebook.fresco:animated-gif:1.10.0'
//    implementation 'com.facebook.fresco:animated-gif:2.5.0'


    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Patch all native .so files and AAB BundleConfig for 16 KB page alignment compatibility
tasks.whenTaskAdded { task ->

    // Hook 1: Patch ELF PT_LOAD alignment from 4KB to 16KB on merged libs
    if (task.name.startsWith('merge') && task.name.endsWith('NativeLibs')) {
        task.doLast {
            def raw = task.name.substring('merge'.length(), task.name.length() - 'NativeLibs'.length())
            def variant = raw.substring(0, 1).toLowerCase() + raw.substring(1)
            def mergedDir = new File(buildDir, "intermediates/merged_native_libs/${variant}/${task.name}/out/lib")
            if (!mergedDir.exists()) {
                mergedDir = new File(buildDir, "intermediates/merged_native_libs/${variant}/out/lib")
            }

            if (mergedDir.exists()) {
                println "16KB ELF patch: scanning mergedDir ${mergedDir}"
                exec {
                    commandLine 'python3',
                        "${rootProject.projectDir}/../scripts/patch_elf_16kb.py",
                        mergedDir.absolutePath
                }
            } else {
                println "16KB ELF patch: mergedDir not found, skipping"
            }
        }
    }

    // Hook 2: Patch ELF PT_LOAD alignment from 4KB to 16KB on stripped libs
    if (task.name.startsWith('strip') && task.name.endsWith('DebugSymbols')) {
        task.doLast {
            def raw = task.name.substring('strip'.length(), task.name.length() - 'DebugSymbols'.length())
            def variant = raw.substring(0, 1).toLowerCase() + raw.substring(1)
            def strippedDir = new File(buildDir, "intermediates/stripped_native_libs/${variant}/${task.name}/out/lib")
            if (!strippedDir.exists()) {
                strippedDir = new File(buildDir, "intermediates/stripped_native_libs/${variant}/out/lib")
            }

            if (strippedDir.exists()) {
                println "16KB ELF patch: scanning strippedDir ${strippedDir}"
                exec {
                    commandLine 'python3',
                        "${rootProject.projectDir}/../scripts/patch_elf_16kb.py",
                        strippedDir.absolutePath
                }
            } else {
                println "16KB ELF patch: strippedDir not found, skipping"
            }
        }
    }

    // Hook 3: Patch AAB BundleConfig.pb + re-sign
    if (task.name == 'bundleRelease') {
        task.doLast {
            def bundleDir = new File(buildDir, "outputs/bundle/release")
            def aabFile = new File(bundleDir, "app-release.aab")

            if (aabFile.exists()) {
                def patchScript = "${rootProject.projectDir}/../scripts/patch_bundleconfig_16kb.py"

                // Patch BundleConfig.pb
                def patchedTmp = new File(aabFile.parent, "_patched_tmp.aab")
                println "16KB AAB: patching BundleConfig.pb..."
                exec { commandLine 'python3', patchScript, aabFile.absolutePath, patchedTmp.absolutePath }
                aabFile.delete()
                patchedTmp.renameTo(aabFile)

                // Re-sign using the release signing config
                println "16KB AAB: re-signing with jarsigner..."
                exec {
                    commandLine 'jarsigner',
                        '-keystore', file("my-release-key.keystore").absolutePath,
                        '-storepass', '123456',
                        '-keypass', '123456',
                        aabFile.absolutePath,
                        'my-key-alias'
                }

                println "16KB AAB: done"
            }
        }
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
